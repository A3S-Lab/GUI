[package]
name = "a3s-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Rust-native cross-platform GUI runtime for structured UI protocol frames"
license = "MIT"
repository = "https://github.com/A3S-Lab/GUI"
homepage = "https://github.com/A3S-Lab/a3s"
keywords = ["a3s", "gui", "native", "web-ui", "accessibility"]
categories = ["gui", "rendering", "accessibility"]

[lib]
name = "a3s_gui"
path = "src/lib.rs"

[[bin]]
name = "a3s-gui-generate-tsx-protocol"
path = "src/bin/generate_tsx_protocol.rs"
required-features = ["typescript-schema"]

[[example]]
name = "component_playground"
required-features = ["authoring"]

[[example]]
name = "self_drawn_calculator"
required-features = ["authoring", "platform-runtime", "software-reference"]


[features]
default = ["headless", "authoring", "design-system", "software-reference"]
headless = []
graphics = ["dep:a3s-graphics"]
software-reference = ["graphics", "a3s-graphics/software"]
gpu = ["graphics", "a3s-graphics/gpu"]
platform-host = []
platform-runtime = ["platform-host", "graphics"]
host-macos = ["platform-host"]
host-windows = ["platform-host"]
host-linux-wayland = ["platform-host"]
host-linux-x11 = ["platform-host"]
host-linux = ["host-linux-wayland", "host-linux-x11"]
authoring = [
    "dep:swc_atoms",
    "dep:swc_common",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_parser",
]
design-system = ["authoring"]
typescript-schema = ["dep:ts-rs"]

[dependencies]
a3s-graphics = { git = "https://github.com/A3S-Lab/Graphics", rev = "8748fab595f8dd7f7ca28767f1c58bd7f3f34ee0", optional = true, default-features = false }
fixed_decimal = { version = "0.7.2", features = ["ryu"] }
icu_collator = "2.2.1"
icu_datetime = "2.2.0"
icu_decimal = { version = "2.2.0", features = ["alloc"] }
icu_experimental = "0.5.0"
icu_locale_core = "2.2.0"
icu_properties = "2.2.0"
icu_provider = { version = "2.2.0", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_atoms = { version = "9.0.3", optional = true }
swc_common = { version = "23.0.2", optional = true }
swc_ecma_ast = { version = "25.0.0", optional = true }
swc_ecma_parser = { version = "41.1.2", optional = true }
ts-rs = { version = "12.0.1", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings"] }
writeable = "0.6.3"

[dev-dependencies]
pollster = "1.0.1"

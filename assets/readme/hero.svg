<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">A3S GUI - Rust RSX today, native TSX planned</title>
  <desc id="desc">A technical system map showing Rust RSX and planned TSX through Nub converging into one versioned A3S UI frame, then producing native layout, Graphics, semantics, accessibility, and interaction records.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4AA8F0"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0B1017"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#263545" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="66" fill="#8FA1B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4">RUST-NATIVE · CROSS-PLATFORM</text>
    <text x="54" y="151" fill="#F5F7FA" font-size="82" font-weight="760" letter-spacing="-3">A3S GUI</text>
    <text x="58" y="207" fill="#D7E0E8" font-size="28" font-weight="540">Rust RSX today. Standard TSX planned.</text>
    <text x="58" y="246" fill="#D7E0E8" font-size="28" font-weight="540">One tree owns semantics and pixels.</text>

    <g transform="translate(58 289)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="246" height="50" rx="10" fill="#101A24" stroke="#2C4053"/>
      <circle cx="22" cy="25" r="5" fill="#1687D9"/>
      <text x="38" y="31" fill="#BFD0DE" font-size="18">ProtocolUiFrameV1</text>
    </g>
    <g transform="translate(320 289)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="170" height="50" rx="10" fill="#101A24" stroke="#2C4053"/>
      <text x="22" y="31" fill="#BFD0DE" font-size="18">1 / 64 pt</text>
    </g>

    <text x="58" y="390" fill="#718496" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.35">M3 RENDERER CURRENT  ·  T0 TSX PROPOSED</text>
  </g>

  <g id="quantization-ruler" stroke="#263545" stroke-width="2">
    <path d="M598 48V372"/>
    <path d="M586 72H610M590 104H606M590 136H606M586 168H610M590 200H606M590 232H606M586 264H610M590 296H606M590 328H606M586 360H610"/>
    <path d="M586 264H610" stroke="#1687D9" stroke-width="4"/>
  </g>

  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">

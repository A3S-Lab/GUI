    <text x="662" y="106" fill="#F5F7FA" font-size="21" font-weight="680">Rust RSX</text>
    <text x="662" y="130" fill="#8FA1B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">ComponentCx</text>


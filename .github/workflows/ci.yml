name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install just
        shell: bash
        run: cargo install just --locked

      - name: Install Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install TypeScript SDK development dependencies
        shell: bash
        run: npm --prefix packages/typescript ci --ignore-scripts

      - name: Run local verification gate
        shell: bash
        run: just verify
